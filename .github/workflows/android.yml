name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Bun and dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bun" --no-package-lock bun@1.4.4
          "$RUNNER_TEMP/bun/node_modules/.bin/bun" install --frozen-lockfile
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure optional Firebase Android registration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      - name: Check and build
        run: |
          npm run lint
          npm run android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: haya-najmaha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
