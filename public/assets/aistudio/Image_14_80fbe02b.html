</head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(92,61,46,0.05)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="الرجوع" class="w-11 h-11 -mr-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-headline-sm text-headline-sm text-primary">تعديل الملف الشخصي والمالي</h1></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover ring-2 ring-primary-container/20" src="https://lh3.googleusercontent.com/aida/AEtjO1VjVdH24FP7WMtlhfA7ouv-j972546t114cFUC9pgbrcakrVEvONsTCk8MNE9FFtCECXvvoflIWAxwrMcOki_SvH-BzgwPoQ9h7o9ASbyvV23czIHUxij0eWIW184wDI1Y1MCsAO6l2yDAkNuZLe7KHUT8ove_WXSwDCRmtdNA4A3j0hV9DhqklkzaNJSqHa3T5S-J0ZxsObtaxi-I1BwD7kwWHFsNaVNLcQ6s8dXgapq99cnZG3PLIaMy7XP9xoNpgKaCa0OI3"/></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full pb-8"><!-- Connected Google Account Bar -->
<div class="mt-space-sm mb-space-md bg-surface-container-lowest p-space-sm rounded-xl shadow-sm flex items-center justify-between border border-outline-variant/30">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<svg class="w-5 h-5" viewbox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-1.5">
<span class="font-label-md text-label-md text-on-surface font-bold truncate">محمد أحمد اليافعي</span>
<span class="material-symbols-outlined text-[16px] text-[#2D6A4F]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate text-left" dir="ltr">m.alyafei@gmail.com</span>
</div>
</div>
<button class="px-3 py-1.5 rounded-lg text-primary hover:bg-surface-container font-label-md text-label-md transition-colors" type="button">
    تغيير
  </button>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-lg" id="profileCompleteForm" onsubmit="event.preventDefault(); return false;">
<!-- SECTION 1: Personal Info -->
<div class="flex flex-col gap-space-md bg-surface-container-lowest p-space-md rounded-xl shadow-sm border border-outline-variant/30">
<div class="flex items-center gap-space-sm border-b border-surface-container pb-space-xs">
<span class="material-symbols-outlined text-[22px] text-primary">person</span>
<h3 class="font-label-lg text-label-lg text-on-surface font-bold">البيانات الشخصية</h3>
</div>
<!-- Full Name Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="fullName">
        الاسم الرباعي الرسمي <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 pr-10 pl-4 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline border border-outline-variant/20" id="fullName" name="fullName" placeholder="أدخل اسمك الرباعي حسب البطاقة" required="" type="text" value="محمد أحمد علي اليافعي"/>
<span class="material-symbols-outlined absolute right-3 text-secondary text-[20px]">badge</span>
</div>
</div>
<!-- Mobile Number Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="phoneNumber">
        رقم الجوال لتنبيهات الأقساط <span class="text-error">*</span>
</label>
<div class="relative flex items-center" dir="ltr">
<input class="w-full h-12 pl-10 pr-20 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all border border-outline-variant/20 tracking-wider text-left" id="phoneNumber" name="phoneNumber" placeholder="7XXXXXXXX" required="" type="tel" value="777123456"/>
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px]">call</span>
<div class="absolute right-3 flex items-center gap-1 text-secondary font-label-md select-none">
<span>+967</span>
<span class="text-outline-variant">|</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">تصلك عبر هذا الرقم إشعارات استلام وتسليم الحصص ومواعيد الأقساط</span>
</div>
</div>
<!-- SECTION 2: Financial Account & Payout Method -->
<div class="flex flex-col gap-space-md bg-surface-container-lowest p-space-md rounded-xl shadow-sm border border-outline-variant/30">
<div class="flex items-center gap-space-sm border-b border-surface-container pb-space-xs">
<span class="material-symbols-outlined text-[22px] text-primary">account_balance_wallet</span>
<h3 class="font-label-lg text-label-lg text-on-surface font-bold">بيانات استلام الأدوار والحصيلة</h3>
</div>
<!-- Clean Segmented Mode Toggle -->
<div class="grid grid-cols-2 p-1 bg-surface-container rounded-lg gap-1">
<button class="h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all bg-surface-container-lowest text-primary shadow-sm font-bold" id="btnTabBank" onclick="selectTransferType('bank')" type="button">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
        حساب بنكي
      </button>
<button class="h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all text-secondary hover:text-on-surface" id="btnTabWallet" onclick="selectTransferType('wallet')" type="button">
<span class="material-symbols-outlined text-[18px]">contactless</span>
        محفظة إلكترونية
      </button>
</div>
<!-- Institution Dropdown -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="institutionSelect" id="institutionLabel">
        اسم البنك <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<select class="w-full h-12 pr-10 pl-8 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md appearance-none focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer border border-outline-variant/20" id="institutionSelect">
<option selected="" value="kuraimi">بنك الكريمي الإسلامي للتمويل الأصغر</option>
<option value="tadhamon">بنك التضامن الإسلامي</option>
<option value="qutaibi">بنك القطيبي الإسلامي</option>
<option value="yemen_intl">بنك اليمن الدولي (IBY)</option>
<option value="alamal">بنك الأمل للتمويل الأصغر</option>
<option value="shamil">بنك الشامل الإسلامي</option>
</select>
<span class="material-symbols-outlined absolute right-3 text-secondary text-[20px]">account_balance</span>
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
<!-- Account / Phone Number -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="accountNumber" id="accountNumberLabel">
        رقم الحساب / الآيبان <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 pr-10 pl-4 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all border border-outline-variant/20 text-left tracking-wider" dir="ltr" id="accountNumber" name="accountNumber" placeholder="أدخل رقم الحساب" required="" type="text" value="210984532"/>
<span class="material-symbols-outlined absolute right-3 text-secondary text-[20px]">pin</span>
</div>
</div>
<!-- Beneficiary Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="beneficiaryName">
        اسم صاحب الحساب المستفيد <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 pr-10 pl-4 bg-surface-container-low text-on-surface rounded-lg font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all border border-outline-variant/20" id="beneficiaryName" name="beneficiaryName" placeholder="الاسم المسجل رسمياً لدى البنك" required="" type="text" value="محمد أحمد علي اليافعي"/>
<span class="material-symbols-outlined absolute right-3 text-secondary text-[20px]">person_check</span>
</div>
</div>
</div>
<!-- Simplified Bottom CTA -->
<div class="flex flex-col gap-space-sm pt-space-xs">
<button class="w-full h-13 py-3.5 px-space-md rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-md hover:bg-primary-container active:scale-[0.99] transition-all cursor-pointer font-bold" id="saveProfileBtn" onclick="handleSaveProfile()" type="button">
<span>حفظ التعديلات</span>
<span class="material-symbols-outlined text-[20px]">check</span>
</button>
<button class="w-full py-2.5 px-space-md rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors font-label-md text-label-md text-center cursor-pointer" onclick="history.back()" type="button">
      إلغاء والعودة
    </button>
</div>
</form>
<script>
  const bankOptions = [
    { id: 'kuraimi', text: 'بنك الكريمي الإسلامي للتمويل الأصغر' },
    { id: 'tadhamon', text: 'بنك التضامن الإسلامي' },
    { id: 'qutaibi', text: 'بنك القطيبي الإسلامي' },
    { id: 'yemen_intl', text: 'بنك اليمن الدولي (IBY)' },
    { id: 'alamal', text: 'بنك الأمل للتمويل الأصغر' },
    { id: 'shamil', text: 'بنك الشامل الإسلامي' }
  ];

  const walletOptions = [
    { id: 'cash', text: 'محفظة كاش (Cash) - الكريمي' },
    { id: 'onecash', text: 'محفظة ون كاش (OneCash)' },
    { id: 'floosak', text: 'محفظة فلوسك (Floosak)' },
    { id: 'jawali', text: 'محفظة جوالي (Jawali)' },
    { id: 'jeeb', text: 'محفظة جيب (Jeeb) - القطيبي' },
    { id: 'sabacash', text: 'محفظة سبأكاش (SabaCash)' }
  ];

  function selectTransferType(type) {
    const btnBank = document.getElementById('btnTabBank');
    const btnWallet = document.getElementById('btnTabWallet');
    const institutionLabel = document.getElementById('institutionLabel');
    const institutionSelect = document.getElementById('institutionSelect');
    const accountNumberLabel = document.getElementById('accountNumberLabel');
    const accountNumber = document.getElementById('accountNumber');

    if (type === 'bank') {
      btnBank.className = 'h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all bg-surface-container-lowest text-primary shadow-sm font-bold';
      btnWallet.className = 'h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all text-secondary hover:text-on-surface';
      institutionLabel.innerHTML = 'اسم البنك <span class="text-error">*</span>';
      accountNumberLabel.innerHTML = 'رقم الحساب / الآيبان <span class="text-error">*</span>';
      accountNumber.placeholder = 'أدخل رقم الحساب';
      accountNumber.value = '210984532';
      institutionSelect.innerHTML = bankOptions.map(b => `<option value="${b.id}">${b.text}</option>`).join('');
    } else {
      btnWallet.className = 'h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all bg-surface-container-lowest text-primary shadow-sm font-bold';
      btnBank.className = 'h-10 rounded-md font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all text-secondary hover:text-on-surface';
      institutionLabel.innerHTML = 'اسم المحفظة الإلكترونية <span class="text-error">*</span>';
      accountNumberLabel.innerHTML = 'رقم المحفظة / الهاتف المرتبط <span class="text-error">*</span>';
      accountNumber.placeholder = '7XXXXXXXX';
      accountNumber.value = '777123456';
      institutionSelect.innerHTML = walletOptions.map(w => `<option value="${w.id}">${w.text}</option>`).join('');
    }
  }

  function handleSaveProfile() {
    const btn = document.getElementById('saveProfileBtn');
    btn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
      <span>جاري الحفظ...</span>
    `;
    setTimeout(() => {
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">check</span>
        <span>تم حفظ البيانات بنجاح</span>
      `;
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-[#2D6A4F]');
    }, 700);
  }
</script></div></main></body></html>
